[tools]
  prek = { version = "0.5.3", postinstall = "prek install && prek prepare-hooks" }

  # Tools run by the s0undt3ch/pre-commit-hooks hooks. These pins are the single
  # source of truth — the hooks run whatever version is on PATH here. Pinned to
  # concrete versions so Renovate can open bump PRs.
  gitleaks   = "8.30.1"
  shellcheck = "0.11.0"
  shfmt      = "3.14.1"
  taplo      = "0.10.0"
  typos      = "1.50.2"
  yamlfmt    = "0.21.0"
