# macOS Homebrew packages (formulae + casks), ported from the previous dotbot
# brew hooks. Only acted on when the brew backend is enabled (macOS).
# metapac's brew backend has no tap support, so tapped casks/formulae are given
# as full `tap/name` paths, which `brew install` auto-taps.
[brew]
  packages = [
    # formulae
    "bat",
    "cap",
    "eza",
    "fd",
    "FelixKratz/formulae/borders",
    "fish",
    "fisher",
    "fzf",
    "git",
    "k9s",
    "kubernetes-cli",
    "mise",
    "neovim",
    "pinentry-mac",
    "pipx",
    "ripgrep",
    "starship",
    "stylua",
    "terminal-notifier",
    "tmux",
    "uv",
    "zoxide",
    # casks
    "alt-tab",
    "db-browser-for-sqlite",
    "font-hack-nerd-font",
    "font-proggy-clean-tt-nerd-font",
    "font-sauce-code-pro-nerd-font",
    "ghostty",
    "logitech-options",
    "naps2",
    "nikitabobko/tap/aerospace",
    "notunes",
    "zed",
  ]
