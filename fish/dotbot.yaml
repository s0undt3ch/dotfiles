- link:
    ~/.config/fish/conf.d: conf.d
    ~/.config/fish/functions: functions
    ~/.config/fish/config.fish: config.fish
    ~/.config/fish/fish_plugins: fish_plugins

- if:
    cond: brew ls --versions terminal-notifier &>/dev/null
    unmet:
      - shell:
          - command: brew install terminal-notifier
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions fish &>/dev/null
    unmet:
      - shell:
          - command: brew install fish
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions fisher &>/dev/null
    unmet:
      - shell:
          - command: brew install fisher
            stdin: true
            stdout: true
            stderr: true
    met:
      - shell:
          - command: fisher update
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: grep -i fish /etc/shells &>/dev/null
    unmet:
      - shell:
          - command: echo '/opt/homebrew/bin/fish' | sudo tee -a /etc/shells
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: echo $SHELL | grep fish &>/dev/null
    unmet:
      - shell:
          - command: chsh -s /opt/homebrew/bin/fish
            stdin: true
            stdout: true
            stderr: true
    met:
      # Update completions
      - shell:
          - command: fish_update_completions
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions eza &>/dev/null
    unmet:
    - shell:
      - command: brew install eza
        stdin: true
        stdout: true
        stderr: true

- if:
    cond: brew ls --versions bat &>/dev/null
    unmet:
    - shell:
      - command: brew install bat
        stdin: true
        stdout: true
        stderr: true
