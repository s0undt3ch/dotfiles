- link:
    ~/.config/nvim: nvim

- if:
    cond: brew ls --versions stylua &>/dev/null
    unmet:
      - shell:
          - command: brew install stylua
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions fd &>/dev/null
    unmet:
      - shell:
          - command: brew install fd
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions ripgrep &>/dev/null
    unmet:
      - shell:
          - command: brew install ripgrep
            stdin: true
            stdout: true
            stderr: true

- if:
    cond: brew ls --versions neovim &>/dev/null
    unmet:
      - shell:
          - command: brew install neovim
            stdin: true
            stdout: true
            stderr: true
