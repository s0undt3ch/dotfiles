[tools]
  python                 = "3.11"
  uv                     = "latest"
  aws                    = "latest"
  usage                  = "latest"
  "pipx:snowflake-cli"   = "latest"
  github-cli             = "latest"
  aqua                   = "latest"
  semgrep                = "latest"
  "aqua:s0undt3ch/ToolR" = "latest"

[settings]
  python.uv_venv_auto                 = true
  python.uv_venv_create_args          = ['--seed']
  python.compile                      = false
  experimental                        = true
  idiomatic_version_file_enable_tools = ["python"]

[env]
  _.file = [{ path = "~/.env" }, { path = "~/.env.secrets", redact = true }]
