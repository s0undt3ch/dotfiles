# macOS overrides for config.toml; keep versions in step with it.

[tools]
  "github:fkiene/llmtrim[exe=llmtrim]" = "0.13.7"
  "github:qdrant/qdrant"               = "1.20.0"

  # Work-only (Paddle).
  aws = { version = "2.39.3", symlink_bins = "true" }
  # pydantic-core has no 3.15 wheel yet. --managed-python skips Homebrew's
  # OpenSSL 4 build, which lacks the ssl.PROTOCOL_TLSv1 the connector needs.
  "pipx:snowflake-cli"    = { version = "3.31.0", uvx_args = "--python 3.14 --managed-python" }
  "npm:@dust-tt/dust-cli" = "0.4.6"

# Homebrew packages, installed by `mise bootstrap` (step 4).
# Tapped formulae use their full owner/tap/name. The aerospace tap cask needs
# Ruby 3 for mise to read it, so tasks/brew-tap-casks installs it instead.
[bootstrap.packages]
  "brew:bat"                                 = {}
  "brew-cask:cap"                            = {}
  "brew:coreutils"                           = {}
  "brew:eza"                                 = {}
  "brew:fd"                                  = {}
  "brew:fish"                                = {}
  "brew:fisher"                              = {}
  "brew:git-gui"                             = {}
  "brew:fzf"                                 = {}
  "brew:git"                                 = {}
  "brew:k9s"                                 = {}
  "brew:kubernetes-cli"                      = {}
  "brew:mise"                                = {}
  "brew:neovim"                              = {}
  "brew:ollama"                              = {}
  "brew:pinentry-mac"                        = {}
  "brew:pipx"                                = {}
  "brew:ripgrep"                             = {}
  "brew:starship"                            = {}
  "brew:stylua"                              = {}
  "brew:terminal-notifier"                   = {}
  "brew:tmux"                                = {}
  "brew:uv"                                  = {}
  "brew:zoxide"                              = {}
  "brew-cask:1password-cli"                  = {}
  "brew-cask:alt-tab"                        = {}
  "brew-cask:claude-code@latest"             = {}
  "brew-cask:db-browser-for-sqlite"          = {}
  "brew-cask:docker-desktop"                 = {}
  "brew-cask:font-hack-nerd-font"            = {}
  "brew-cask:font-proggy-clean-tt-nerd-font" = {}
  "brew-cask:font-sauce-code-pro-nerd-font"  = {}
  "brew-cask:ghostty"                        = {}
  "brew-cask:logitech-options"               = {}
  "brew-cask:naps2"                          = {}
  "brew-cask:notion"                         = {}
  "brew-cask:notunes"                        = {}
  "brew-cask:session-manager-plugin"         = {}
  "brew-cask:zed"                            = {}

# mempalace services. Programs go through mise shims, so a tool bump needs only
# a restart (tasks/restart-mempalace), not a plist change.
[bootstrap.macos.launchd.agents.qdrant]
  program           = "~/.local/share/mise/shims/qdrant"
  args              = ["--config-path", "{{ config_root }}/.config/qdrant/config.yaml"]
  working_directory = "~/.local/share/qdrant"
  run_at_load       = true
  keep_alive        = true
  throttle_interval = 10
  stdout_path       = "~/Library/Logs/qdrant.log"
  stderr_path       = "~/Library/Logs/qdrant.log"

[bootstrap.macos.launchd.agents.mempalace-hub]
  program           = "~/.local/share/mise/shims/mempalace"
  args              = ["serve"]
  working_directory = "~"
  run_at_load       = true
  keep_alive        = true
  throttle_interval = 30
  stdout_path       = "~/Library/Logs/mempalace-hub.log"
  stderr_path       = "~/Library/Logs/mempalace-hub.log"

[bootstrap.macos.launchd.agents.mempalace-wings]
  program                 = "/usr/bin/caffeinate"
  args                    = ["-s", "{{ config_root }}/.local/bin/mempalace-wings"]
  working_directory       = "~"
  start_calendar_interval = { hour = 3, minute = 0 }
  stdout_path             = "~/Library/Logs/mempalace-wings.log"
  stderr_path             = "~/Library/Logs/mempalace-wings.log"

  [bootstrap.macos.launchd.agents.mempalace-wings.environment]
    PATH                     = "/usr/bin:/bin:/usr/sbin:/sbin"
    MEMPALACE_SYNC_APPLY     = "0"
    MEMPALACE_MAINTAIN_MODEL = "{{ vars.mempalace_llm_model }}"

# Quiet hours.
[bootstrap.macos.launchd.agents.mute-at-2100]
  program                 = "/usr/bin/osascript"
  args                    = ["-e", "set volume output muted true"]
  run_at_load             = false
  start_calendar_interval = { hour = 21, minute = 0 }

[bootstrap.macos.launchd.agents.unmute-at-0900]
  program                 = "/usr/bin/osascript"
  args                    = ["-e", "set volume output muted false"]
  run_at_load             = false
  start_calendar_interval = { hour = 9, minute = 0 }

[tasks.bootstrap-platform]
  description = "macOS-only post-install setup"
  run         = [{ task = "brew-tap-casks" }, { task = "mempalace-wake" }]
