# Global mise config, symlinked from ~/.config/mise. Linux x86_64 asset picks
# live here; config.macos.toml and config.linux-arm64.toml override them
# (auto_env in miserc.toml loads the platform file).

[tools]
  "github:abhinav/git-spice" = "0.33.0"
  "pipx:mempalace"           = "3.11.0"
  usage                      = "7.1.3"

  python                   = "3.14.9"
  uv                       = "0.13.5"
  github-cli               = "2.103.2"
  aqua                     = "2.65.2"
  semgrep                  = "1.182.1"
  "aqua:s0undt3ch/ToolR"   = "0.35.0"
  "aqua:redhat-et/ripwire" = "0.6.8"
  bun                      = "1.4.4"
  "aqua:quarylabs/sqruff"  = "0.43.0"
  jq                       = "1.8.2"
  atuin                    = "18.24.2"

  node                         = "26.12.1"
  "aqua:quarto-dev/quarto-cli" = "1.10.19"
  herdr                        = "0.9.5"
  vale                         = "3.25.1"

  # llmtrim CLI, required by the llmtrim-herdr plugin (herdr-lazy plugins.list).
  # Prebuilt Rust binary from GitHub releases — avoids the npm/Node wrapper.
  # On linux x86_64 the release ships two candidate assets (plain musl CLI and a
  # gnu "tray" GUI build); pin matching=musl so ubi/github doesn't grab the tray one.
  "github:fkiene/llmtrim[matching=musl,exe=llmtrim]" = "0.13.7"

  # MemPalace vector store, run as a user service (qdrant launchd/systemd unit).
  # Linux x86_64 ships gnu and musl tarballs; pin gnu so the pick is stable.
  "github:qdrant/qdrant[matching=linux-gnu]" = "1.20.0"

[settings]
  python.uv_venv_auto                 = true
  python.uv_venv_create_args          = ['--seed']
  python.compile                      = false
  experimental                        = true
  idiomatic_version_file_enable_tools = ["python"]

  dotfiles.root = "~/projects/me/dotfiles/files"
  # A git pull touches mtimes; only real content changes should re-run tasks.
  task.source_freshness_hash_contents = true
  # Even `mise dot status` starts a history repo otherwise; nothing is tracked.
  history.enabled = false

[env]
  _.file = [{ path = "~/.env" }, { path = "~/.env.secrets", redact = true }]

[vars]
  mempalace_llm_model = "qwen3:8b"

# A TOML task, not a file task, so `run` can read vars.mempalace_llm_model.
[tasks.ollama-pull]
  description = "Pull the Ollama model mempalace-maintain uses"
  sources = ["{{env.HOME}}/.config/mise/config.toml"]
  shell = "bash -c"
  run = '''
set -euo pipefail
model="{{ vars.mempalace_llm_model }}"

if ! command -v ollama >/dev/null 2>&1; then
    echo "ollama not installed; skipping pull of ${model}."
    exit 0
fi
if [ "$(uname)" = "Darwin" ]; then
    brew services start ollama >/dev/null
fi

for _ in $(seq 1 40); do
    curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
    sleep 0.25
done
if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
    echo "ollama is not answering on 127.0.0.1:11434; skipping pull of ${model}."
    exit 0
fi

if ollama list | awk 'NR > 1 { print $1 }' | grep -qxF -e "${model}" -e "${model}:latest"; then
    echo "ollama already has ${model}."
else
    echo "==> ollama pull ${model}"
    ollama pull "${model}"
fi
'''

# Run by `mise bootstrap` after tools are installed. One after another: the
# sudo-needing tasks go last so a missing terminal can't stop the rest.
[tasks.bootstrap]
  description = "Post-install setup: plugins, models, login items, root bits"
  run = [
    { task = "retire-chezmoi-services" },
    { task = "brew-tap-casks" },
    { task = "claude-plugins" },
    { task = "herdr-sync" },
    { task = "llmtrim-autostart" },
    { task = "ollama-pull-gemma" },
    { task = "ollama-pull" },
    { task = "restart-mempalace" },
    { task = "nvidia-sleep" },
    { task = "nm-wifi-powersave" },
    { task = "mempalace-wake" },
  ]
