# A copy source defaults to the target's path under files/. Templates need an
# explicit source because of the .tera suffix.

[dotfiles]
  "~/.config/fish" = { mode = "copy", exclude = [
    "conf.d/00_paths.fish.tera",
    "conf.d/mise-github-token.fish.tera",
    "config.fish.tera",
    "**/.DS_Store",
  ] }
  "~/.config/fish/config.fish" = { mode = "template", source = "~/projects/me/dotfiles/files/.config/fish/config.fish.tera" }
  "~/.config/fish/conf.d/00_paths.fish" = { mode = "template", source = "~/projects/me/dotfiles/files/.config/fish/conf.d/00_paths.fish.tera" }
  "~/.config/fish/conf.d/mise-github-token.fish" = { mode = "template", source = "~/projects/me/dotfiles/files/.config/fish/conf.d/mise-github-token.fish.tera" }

  # nvim owns its lockfile and lazyvim.json at runtime.
  "~/.config/nvim" = { mode = "copy", exclude = ["lazy-lock.json", "lazyvim.json", "**/.DS_Store"] }

  "~/.config/ghostty/config" = { mode = "template", source = "~/projects/me/dotfiles/files/.config/ghostty/config.tera" }
  "~/.config/git/ignore"     = { mode = "copy" }
  "~/.gitconfig"             = { mode = "template", source = "~/projects/me/dotfiles/files/.gitconfig.tera" }
  "~/.gitconfig.paddle"      = { mode = "copy" }
  "~/.gitconfig.personal"    = { mode = "copy" }
  "~/.gitconfig.work"        = { mode = "copy" }

  "~/.config/zed/settings.json"   = { mode = "template", source = "~/projects/me/dotfiles/files/.config/zed/settings.json.tera" }
  "~/.config/wezterm/wezterm.lua" = { mode = "copy" }
  "~/.config/starship.toml"       = { mode = "copy" }
  "~/.tmux.conf"                  = { mode = "copy" }

  "~/.gnupg"                = { permissions = "0700" }
  "~/.gnupg/gpg-agent.conf" = { mode = "template", source = "~/projects/me/dotfiles/files/.gnupg/gpg-agent.conf.tera", permissions = "0600" }
  "~/.config/powerdevilrc"  = { mode = "copy", permissions = "0600" }

  "~/Library/KeyBindings/DefaultKeyBinding.dict" = { mode = "copy", variants = [{ os = "macos" }] }

  "~/.config/aerospace" = { mode = "copy", variants = [{ profile = "work" }] }
  "~/.config/k9s"       = { mode = "copy", variants = [{ profile = "work" }] }

  "~/.local/bin/ff"                  = { mode = "copy", permissions = "0755" }
  "~/.local/bin/kill-ff"             = { mode = "copy", permissions = "0755" }
  "~/.local/bin/tmux-shared-windows" = { mode = "copy", permissions = "0755" }
  "~/.local/bin/claude"              = { mode = "template", source = "~/projects/me/dotfiles/files/.local/bin/claude.tera", permissions = "0755" }
  "~/.local/bin/claude-work"         = { mode = "copy", permissions = "0755", variants = [{ profile = "work" }] }
  "~/.local/bin/claude-personal"     = { mode = "copy", permissions = "0755", variants = [{ profile = "work" }] }

  # The work profile lives in ~/.claude, which plugins hardcode; the link keeps old absolute paths working.
  "~/.claude-work"      = { mode = "symlink", source = "~/.claude", variants = [{ os = "macos", profile = "work" }] }
  "~/.claude/CLAUDE.md" = { mode = "copy", variants = [{ os = "macos", profile = "work" }] }

  # Retired targets: remove them wherever they linger.
  "~/.config/fish/conf.d/claude-work.fish"                         = { mode = "absent" }
  "~/.config/fish/conf.d/claude-personal.fish"                     = { mode = "absent" }
  "~/.config/herdr/plugins/local/startup-layout/herdr-plugin.toml" = { mode = "absent" }
  "~/.config/claude/hooks/create-worktree.sh"                      = { mode = "absent" }
  "~/.config/herdr/plugins/config/herdr-spreader/config.yaml"      = { mode = "absent" }

  # herdr: files only, the directory is full of runtime state.
  "~/.config/herdr/config.toml"                            = { mode = "copy" }
  "~/.config/herdr/plugins/config/herdr-lazy/plugins.list" = { mode = "template", source = "~/projects/me/dotfiles/files/.config/herdr/plugins/config/herdr-lazy/plugins.list.tera" }

  # mempalace: qdrant config and the scripts the services run.
  "~/.config/qdrant/config.yaml"    = { mode = "template", source = "~/projects/me/dotfiles/files/.config/qdrant/config.yaml.tera" }
  "~/.local/bin/mempalace-wings"    = { mode = "copy", permissions = "0755" }
  "~/.local/bin/mempalace-maintain" = { mode = "template", source = "~/projects/me/dotfiles/files/.local/bin/mempalace-maintain.tera", permissions = "0755" }

  # Pre-mise service definitions, replaced by dev.mise.*.
  "~/Library/LaunchAgents/com.pedro.qdrant.plist"          = { mode = "absent", variants = [{ os = "macos" }] }
  "~/Library/LaunchAgents/com.pedro.mempalace-hub.plist"   = { mode = "absent", variants = [{ os = "macos" }] }
  "~/Library/LaunchAgents/com.pedro.mempalace-wings.plist" = { mode = "absent", variants = [{ os = "macos" }] }
  "~/Library/LaunchAgents/com.pedro.mute-at-2100.plist"    = { mode = "absent", variants = [{ os = "macos" }] }
  "~/Library/LaunchAgents/com.pedro.unmute-at-0900.plist"  = { mode = "absent", variants = [{ os = "macos" }] }
  "~/.config/systemd/user/qdrant.service"                  = { mode = "absent", variants = [{ os = "linux" }] }
  "~/.config/systemd/user/mempalace-hub.service"           = { mode = "absent", variants = [{ os = "linux" }] }
  "~/.config/systemd/user/mempalace-wings.service"         = { mode = "absent", variants = [{ os = "linux" }] }
  "~/.config/systemd/user/mempalace-wings.timer"           = { mode = "absent", variants = [{ os = "linux" }] }

  # mempalace owns the rest of config.json (wings, hall_keywords); only these keys are ours.
  "~/.mempalace"                    = { permissions = "0700" }
  "~/.mempalace/config.json/shared" = { source = "~/projects/me/dotfiles/files/.mempalace/config.merge.json.tera", merge = true, template = "tera", permissions = "0600" }
