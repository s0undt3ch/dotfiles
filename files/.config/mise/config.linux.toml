# Linux-only config, loaded through auto_env. System services live here because
# `mise bootstrap services` fails on macOS when one is declared.

[bootstrap.services.ollama]
  state   = "running"
  enabled = true

# pacman + AUR (via yay) packages, installed by `mise bootstrap` (step 4).
# Neither manager prunes, so dropping a line does not uninstall anything.
# yay-bin itself has to be installed by hand on a fresh machine.
