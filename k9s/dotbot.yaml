- link:
    ~/Library/Application Support/k9s/plugins.yaml: plugins.yaml
    ~/Library/Application Support/k9s/config.yaml: config.yaml
- if:
    cond: brew ls --versions k9s &>/dev/null
    unmet:
      - shell:
          - command: brew install k9s
            stdin: true
            stdout: true
            stderr: true
- if:
    cond: brew ls --versions kubernetes-cli &>/dev/null
    unmet:
      - shell:
          - command: brew install kubernetes-cli
            stdin: true
            stdout: true
            stderr: true
- shell:
    - description: Install catppuccin k9s skins
      command: bash -c 'OUT="$HOME/Library/Application Support/k9s/skins"; mkdir -p "$OUT" && curl -fsSL https://github.com/catppuccin/k9s/archive/main.tar.gz | tar xz -C "$OUT" --strip-components=2 k9s-main/dist'
      stdout: true
      stderr: true
