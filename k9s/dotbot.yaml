- link:
    ~/Library/Application Support/k9s/plugins.yaml: plugins.yaml
    ~/Library/Application Support/k9s/config.yaml: config.yaml
- if:
    cond: brew ls --versions k9s &>/dev/null
    unmet:
      - shell:
          - command: brew install k9s
            stdin: true
            stdout: true
            stderr: true
- if:
    cond: brew ls --versions hl &>/dev/null
    unmet:
      - shell:
          - command: brew install hl
            stdin: true
            stdout: true
            stderr: true
- if:
    cond: brew ls --versions kubernetes-cli &>/dev/null
    unmet:
      - shell:
          - command: brew install kubernetes-cli
            stdin: true
            stdout: true
            stderr: true
- shell:
    - description: Install catppuccin k9s skins
      command: bash -c 'OUT="$HOME/Library/Application Support/k9s/skins"; mkdir -p "$OUT" && curl -fsSL https://github.com/catppuccin/k9s/archive/main.tar.gz | tar xz -C "$OUT" --strip-components=2 k9s-main/dist'
      stdout: true
      stderr: true
    - description: Install upstream k9s gruvbox skins
      command: bash -c 'OUT="$HOME/Library/Application Support/k9s/skins"; mkdir -p "$OUT" && for name in gruvbox-dark gruvbox-dark-hard gruvbox-light gruvbox-light-hard gruvbox-material-dark-hard gruvbox-material-dark-medium gruvbox-material-dark-soft gruvbox-material-light-hard gruvbox-material-light-medium gruvbox-material-light-soft; do curl -fsSL -o "$OUT/$name.yaml" "https://raw.githubusercontent.com/derailed/k9s/master/skins/$name.yaml"; done'
      stdout: true
      stderr: true
