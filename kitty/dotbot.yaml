- if:
    cond: brew ls --versions --cask kitty &>/dev/null
    unmet:
      - shell:
          - command: brew install --cask kitty
            stdin: true
            stdout: true
            stderr: true

- link:
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.config/kitty/current-theme.conf: catppuccin-mocha.conf
