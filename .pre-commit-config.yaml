minimum_pre_commit_version: 3.0.0
repos:
  # Generic file hygiene (no equivalent in the system-tool hooks below).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict # Check for files that contain merge conflict strings.
      - id: trailing-whitespace # Trims trailing whitespace.
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending # Replaces or checks mixed line ending.
        args: [--fix=lf]
      - id: end-of-file-fixer # Makes sure files end in a newline and only a newline.
  # System-installed tools, versions pinned in mise.toml (single source of
  # truth — no drift). See https://github.com/s0undt3ch/pre-commit-hooks.
  - repo: https://github.com/s0undt3ch/pre-commit-hooks
    rev: v1.1.0
    hooks:
      - id: gitleaks # Scan staged changes for hardcoded secrets.
      - id: typos # Source-code spell checker (config in typos.toml).
      - id: shellcheck # Static analysis for shell scripts.
        exclude: '^bin/git-clone-branches-layout$|\.tmpl$' # zsh / chezmoi templates
      - id: shfmt # Format shell scripts in place.
        exclude: '^bin/git-clone-branches-layout$|\.tmpl$' # zsh / chezmoi templates
      - id: yamlfmt # Format YAML files.
      - id: system-tool # Format TOML with taplo (respects .taplo.toml).
        alias: taplo-format
        name: taplo format
        args: [taplo, format]
        types: [toml]

